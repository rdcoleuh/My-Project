name: MineWorld regression tests

on:
  push:
    branches:
      - gh-pages
  pull_request:
    branches:
      - gh-pages

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out game
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run MineWorld tests
        run: node --test tests/*.test.cjs
      - name: Install temporary browser smoke runner
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
      - name: Verify menu and gameplay in desktop and mobile Chrome
        run: node scripts/browser-smoke.cjs
