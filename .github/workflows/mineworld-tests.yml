name: MineWorld regression tests

on:
  push:
    branches:
      - gh-pages
  pull_request:
    branches:
      - gh-pages

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out game
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run MineWorld tests
        run: node --test tests/*.test.cjs
      - name: Install temporary browser smoke runner
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
      - name: Install Playwright video recorder
        run: npx playwright install ffmpeg
      - name: Verify menu and gameplay in desktop and mobile Chrome
        run: node scripts/browser-smoke.cjs
      - name: Ensure FFmpeg is available for short clips
        if: always()
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -n 1
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Trim short HUD and crafting-table gameplay demonstrations
        if: always()
        run: |
          mkdir -p artifacts/clips
          for device in desktop mobile; do
            source="artifacts/recordings/${device}-smoke.webm"
            if [ -f "$source" ]; then
              ffmpeg -y -loglevel error -sseof -14 -i "$source" -t 8 -an -c:v libvpx -deadline realtime -cpu-used 8 -b:v 1300k "artifacts/clips/${device}-hud-and-inventory.webm"
              ffmpeg -y -loglevel error -sseof -8 -i "$source" -t 8 -an -c:v libvpx -deadline realtime -cpu-used 8 -b:v 1300k "artifacts/clips/${device}-workbench-regression.webm"
            fi
          done
      - name: Upload visible gameplay recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mineworld-gameplay-videos
          path: |
            artifacts/clips/*.webm
            artifacts/recordings/*.webm
          if-no-files-found: warn
          retention-days: 7
