name: MineWorld regression tests

on:
  push:
    branches:
      - gh-pages
      - experiment/local-minecraft-textures
  pull_request:
    branches:
      - gh-pages
      - experiment/local-minecraft-textures

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out game
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run MineWorld tests
        run: node --test tests/*.test.cjs
