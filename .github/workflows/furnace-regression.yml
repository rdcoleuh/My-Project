name: Furnace regression tests
on:
  push:
    branches: [gh-pages]
    paths:
      - 'furnace-engine.js'
      - 'furnace-ui.js'
      - 'tests/furnace-*.test.cjs'
      - '.github/workflows/furnace-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  furnace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run executable furnace regression suite
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results
          node --test --test-reporter=tap tests/furnace-*.test.cjs 2>&1 | tee test-results/furnace-tap.log
      - name: Upload furnace diagnostics even when tests fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: furnace-regression-${{ github.run_id }}
          path: test-results/furnace-tap.log
          if-no-files-found: warn
          retention-days: 14
